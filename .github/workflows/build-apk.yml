name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Copy website into the app
        run: |
          W=app/src/main/assets/www
          mkdir -p $W
          cp ../index.html ../expenses.html ../work.html ../manager.html ../config.js ../manifest.json $W/
          cp -r ../icons ../img $W/

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ../LeeEnterprise.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LeeEnterprise-apk
          path: LeeEnterprise.apk
