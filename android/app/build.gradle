plugins {
    id 'com.android.application'
}

android {
    namespace 'com.leeenterprise.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.leeenterprise.app"
        minSdk 26
        targetSdk 34
        // Every GitHub build gets a higher number, so it installs over the old app
        versionCode 10 + (System.getenv("GITHUB_RUN_NUMBER") ?: "0").toInteger()
        versionName "3." + (System.getenv("GITHUB_RUN_NUMBER") ?: "0")
    }

    // Same signing key for every build, so updates install without uninstalling
    signingConfigs {
        lee {
            storeFile file("lee-release.keystore")
            storePassword "leeenterprise"
            keyAlias "lee"
            keyPassword "leeenterprise"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.lee
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.13.1'
}
