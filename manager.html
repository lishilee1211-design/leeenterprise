<style>
:root{--navy:#071a3d;--navy2:#0a2350;--blue:#1a5fd0;--mint:#7ff0a8;--green:#2e9b4a;--red:#d64545;--ink:#0e1a2b;--muted:#617089;--line:#e2e8f2;--bg:#f2f5fa;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Poppins,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font-family:inherit;font-size:15px}
.top{background:linear-gradient(150deg,#05102a,#0a2350 60%,#123f8c);color:#fff;padding:calc(12px + var(--safe-t)) 16px 12px;flex:0 0 auto}
.top .row{display:flex;align-items:center;gap:12px;max-width:820px;margin:0 auto}
.av{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#4d9bff,#7ff0a8);display:grid;place-items:center;flex:0 0 44px;position:relative}
.av svg{width:24px;height:24px}
.av i{position:absolute;right:-2px;bottom:-2px;width:12px;height:12px;border-radius:50%;background:#3ddc84;border:2px solid #0a2350}
.top b{font-family:Rajdhani,sans-serif;font-size:20px;letter-spacing:.04em;display:block;line-height:1}
.top small{color:#b8c8e6;font-size:12px}
.top .r{margin-left:auto;display:flex;gap:6px}
.top .r button,.top .r a{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:10px;padding:7px 10px;font-size:12.5px;cursor:pointer;text-decoration:none;display:inline-flex;gap:6px;align-items:center}
.top .r button.on{background:var(--mint);color:var(--navy2);border-color:var(--mint)}
#log{flex:1;overflow-y:auto;padding:16px 14px}
.inner{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.bub{max-width:86%;padding:12px 15px;border-radius:18px;font-size:14.5px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.bub.u{align-self:flex-end;background:linear-gradient(135deg,var(--blue),var(--navy2));color:#fff;border-bottom-right-radius:5px}
.bub.a{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:5px}
.bub.err{border-color:#f1c4c4;background:#fff6f6;color:#8a2a2a}
.bub img{max-width:220px;border-radius:10px;margin-top:8px;display:block}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.acts span{font-size:11.5px;background:#e3f6e8;color:#1d7a3a;border-radius:999px;padding:3px 9px;font-weight:600}
.acts span.no{background:#fde8e8;color:#b03030}
.typing{align-self:flex-start;background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 18px;display:flex;gap:5px}
.typing i{width:8px;height:8px;border-radius:50%;background:#9fb0cf;animation:b 1.2s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{30%{transform:translateY(-6px);background:var(--blue)}}
.hello{text-align:center;padding:24px 10px 6px}
.hello .av{width:70px;height:70px;border-radius:22px;margin:0 auto 12px}
.hello .av svg{width:36px;height:36px}
.hello h2{font-size:21px}
.hello p{color:var(--muted);font-size:14px;max-width:460px;margin:6px auto 0}
.sugs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
.sugs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;font-size:13px;cursor:pointer;color:#33445e;text-align:left}
.sugs button:hover{border-color:var(--blue);color:var(--blue)}
.bar{flex:0 0 auto;background:#fff;border-top:1px solid var(--line);padding:10px 12px calc(10px + var(--safe-b))}
.bar .in{max-width:820px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
.bar textarea{flex:1;border:1px solid #d6dfec;border-radius:22px;padding:12px 16px;resize:none;max-height:140px;min-height:48px;outline:none;background:#f9fbfe;line-height:1.4}
.bar textarea:focus{border-color:var(--blue);background:#fff}
.ib{flex:0 0 48px;height:48px;border-radius:50%;border:0;cursor:pointer;display:grid;place-items:center;position:relative;overflow:hidden}
.ib svg{width:22px;height:22px}
.ib.att{background:#eef2f8;color:#55657e}.ib.att input{position:absolute;inset:0;opacity:0;cursor:pointer}
.ib.att.has{background:#e3f6e8;color:var(--green)}
.ib.mic{background:#eef2f8;color:var(--navy2)}
.ib.mic.rec{background:var(--red);color:#fff;animation:rec 1.2s infinite}
@keyframes rec{50%{box-shadow:0 0 0 10px rgba(214,69,69,.15)}}
.ib.go{background:linear-gradient(135deg,var(--blue),var(--navy2));color:#fff}
.ib:disabled{opacity:.5}
.lang{font-size:11px;color:var(--muted);text-align:center;margin-top:6px}
.lang button{border:0;background:none;color:var(--blue);font-weight:600;cursor:pointer;font-size:11px}
.lock{max-width:380px;margin:40px auto;text-align:center;background:#fff;border:1px solid var(--line);border-radius:20px;padding:26px}
.pin{display:flex;gap:10px;justify-content:center;margin:16px 0}
.pin input{width:54px;height:60px;text-align:center;font-size:24px;font-weight:700;border:1px solid #d6dfec;border-radius:12px;background:#f9fbfe}
.muted{color:var(--muted);font-size:13px}
.demo{background:#fff4dd;color:#8a5a00;border:1px solid #f3d699;padding:10px 14px;border-radius:12px;font-size:13px}
.hidden{display:none!important}
@media (max-width:480px){.top small{display:none}.top b{font-size:17px}.top .r a{display:none}.top .r button{padding:6px 8px}}
</style>
</head>

  <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#1a5fd0" stroke-width="1.8"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>
  <h3 style="margin-top:8px">Owner only</h3>
  <p class="muted" id="lockMsg">Enter your 4-digit PIN</p>
  <div class="pin" id="pinBox"><input maxlength="1" inputmode="numeric" type="password"><input maxlength="1" inputmode="numeric" type="password"><input maxlength="1" inputmode="numeric" type="password"><input maxlength="1" inputmode="numeric" type="password"></div>
  <p class="muted" id="lockHelp"></p>
</div>

<div id="log" class="hidden"><div class="inner" id="inner"></div></div>

<div class="bar hidden" id="bar">
  <div class="in">
    <label class="ib att" id="attBtn" title="Attach photo (bill, site photo)"><input type="file" accept="image/*" id="file"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h3l2-3h6l2 3h3a1 1 0 011 1v11a1 1 0 01-1 1H4a1 1 0 01-1-1V8a1 1 0 011-1z"/><circle cx="12" cy="13" r="4"/></svg></label>
    <textarea id="txt" rows="1" placeholder="Type or speak…"></textarea>
    <button class="ib mic" id="mic" title="Speak"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a3 3 0 013 3v5a3 3 0 01-6 0V6a3 3 0 013-3z"/><path d="M19 11a7 7 0 01-14 0M12 18v3"/></svg></button>
    <button class="ib go" id="send" title="Send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
  </div>
  <div class="lang">Voice language: <button id="langBtn"></button></div>
</div>

<script>
const mem={};const S={get(k,d){try{const v=localStorage.getItem('lee_'+k);return v===null?d:JSON.parse(v)}catch(e){return k in mem?mem[k]:d}},set(k,v){mem[k]=v;try{localStorage.setItem('lee_'+k,JSON.stringify(v))}catch(e){}}};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const server=()=>S.get('url','')||window.LEE_SERVER||'';
const isDemo=()=>!server();
const TOOL_LABEL={add_expense:'Expense saved',create_project:'Project created',add_project_update:'Update posted',set_project:'Project changed',list_projects:'Read projects',expense_summary:'Read totals',set_expense_status:'Expense status changed',pending_expenses:'Read pending',client_messages:'Read messages',reply_to_client:'Reply sent'};
let hist=S.get('ai_hist',[]), photo='', busy=false, speak=S.get('ai_speak',false), lang=S.get('ai_lang','en-IN');

/* ---------- lock ---------- */
function unlock(){ $('lockBox').classList.add('hidden');$('log').classList.remove('hidden');$('bar').classList.remove('hidden');render();setTimeout(()=>$('txt').focus(),100) }
if(isDemo()){$('lockMsg').textContent='Demo: enter any 4 digits'}
else if(!S.get('key','')||!S.get('pin','')){$('lockMsg').textContent='Owner key and PIN are not set on this phone.';$('lockHelp').innerHTML='Set them once in <a href="expenses.html">Expenses → ⚙ Settings → Owner setup</a>.'}
[...$('pinBox').children].forEach((inp,i,arr)=>{
  inp.addEventListener('input',()=>{inp.value=inp.value.replace(/\D/g,'').slice(-1);if(inp.value&&i<3)arr[i+1].focus();const v=arr.map(x=>x.value).join('');if(v.length===4){if(isDemo()||v===S.get('pin',''))unlock();else{$('lockMsg').textContent='Wrong PIN';arr.forEach(x=>x.value='');arr[0].focus()}}});
  inp.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!inp.value&&i>0)arr[i-1].focus()});
});
setTimeout(()=>$('pinBox').children[0].focus(),100);

/* ---------- render ---------- */
const SUGS=['₹850 diesel for Poma site, paid cash by Tana','Any new client messages?','How much did we spend this month, Lee vs T.N?','Post update on Burm sports complex: layout approved by client, 30%','Create project: Boundary survey at Doimukh for Mr. Tage, show on website','Pending expenses approve kar do'];
function render(){
  const el=$('inner');
  el.innerHTML=(isDemo()?'<div class="demo">Demo mode — replies are samples. Add your server link and API key to go live.</div>':'')+
   (hist.length?'':`<div class="hello"><div class="av"><svg viewBox="0 0 24 24" fill="none" stroke="#0a2350" stroke-width="2"><rect x="4" y="7" width="16" height="12" rx="4"/><path d="M12 7V4M9 13h.01M15 13h.01M9.5 16h5"/></svg></div>
     <h2>Namaste! I'm your office manager.</h2><p>Tell me in English, Hindi or Hinglish — I'll record expenses, create projects, post progress for clients, put work on the website and reply to client messages.</p>
     <div class="sugs">${SUGS.map(s=>`<button>${esc(s)}</button>`).join('')}</div></div>`)+
   hist.map(m=>`<div class="bub ${m.role==='user'?'u':'a'} ${m.err?'err':''}">${esc(m.text)}${m.img?`<img src="${m.img}" alt="">`:''}${m.actions&&m.actions.length?`<div class="acts">${m.actions.map(a=>`<span class="${a.ok?'':'no'}">${a.ok?'✓':'✗'} ${TOOL_LABEL[a.tool]||a.tool}</span>`).join('')}</div>`:''}</div>`).join('')+
   (busy?'<div class="typing"><i></i><i></i><i></i></div>':'');
  el.querySelectorAll('.sugs button').forEach(b=>b.onclick=()=>{$('txt').value=b.textContent;send()});
  $('log').scrollTop=$('log').scrollHeight;
}
function save(){S.set('ai_hist',hist.slice(-40).map(m=>({...m,img:undefined})))}

/* ---------- send ---------- */
async function send(){
  const t=$('txt').value.trim(); if((!t&&!photo)||busy) return;
  hist.push({role:'user',text:t||'(photo)',img:photo}); const ph=photo;
  $('txt').value='';autosize();photo='';$('attBtn').classList.remove('has');$('file').value='';
  busy=true;render();
  try{
    const msgs=hist.filter(m=>!m.err).map(m=>({role:m.role,text:m.text})).slice(-16);
    const j=isDemo()?await demo(t):await (await fetch(server(),{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'ai',key:S.get('key',''),messages:msgs,photo:ph}),redirect:'follow'})).json();
    if(!j.ok) throw new Error(j.error||'Error');
    hist.push({role:'assistant',text:j.reply,actions:j.actions||[]}); say(j.reply);
  }catch(e){hist.push({role:'assistant',text:'Sorry — '+e.message,err:true})}
  busy=false;save();render();
}
$('send').onclick=send;
$('txt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
function autosize(){const t=$('txt');t.style.height='auto';t.style.height=Math.min(140,t.scrollHeight)+'px'} $('txt').addEventListener('input',autosize);
$('clearBtn').onclick=()=>{hist=[];save();render()};
$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;photo=await shrink(f);$('attBtn').classList.add('has')};
function shrink(file,max=1400,q=.75){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{let w=im.width,h=im.height;const s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);res(c.toDataURL('image/jpeg',q))};im.src=fr.result};fr.readAsDataURL(file)})}

/* ---------- voice in ---------- */
const LANGS={'en-IN':'English (India)','hi-IN':'हिन्दी'};
function showLang(){$('langBtn').textContent=LANGS[lang]+' ⇄'} showLang();
$('langBtn').onclick=()=>{lang=lang==='en-IN'?'hi-IN':'en-IN';S.set('ai_lang',lang);showLang()};
let rec=null, recOn=false;
window.leeVoice=(text)=>{recOn=false;$('mic').classList.remove('rec');if(text){$('txt').value=(($('txt').value+' '+text).trim());autosize();send()}};
window.leeVoiceError=(m)=>{recOn=false;$('mic').classList.remove('rec');if(m)hist.push({role:'assistant',text:'Mic: '+m,err:true}),render()};
$('mic').onclick=()=>{
  if(window.LeeApp&&LeeApp.listen){ if(!recOn){recOn=true;$('mic').classList.add('rec');LeeApp.listen(lang)} return }
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){hist.push({role:'assistant',text:'Voice input works in Chrome on Android/PC or inside the Lee Enterprise app. You can also use your keyboard\'s mic button.',err:true});render();return}
  if(recOn){rec&&rec.stop();return}
  rec=new SR();rec.lang=lang;rec.interimResults=true;rec.continuous=false;let finalT='';
  rec.onresult=e=>{let t='';for(const r of e.results){t+=r[0].transcript;if(r.isFinal)finalT=t}$('txt').value=t;autosize()};
  rec.onend=()=>{recOn=false;$('mic').classList.remove('rec');if(finalT||$('txt').value.trim())send()};
  rec.onerror=e=>{recOn=false;$('mic').classList.remove('rec');if(e.error!=='no-speech'&&e.error!=='aborted'){hist.push({role:'assistant',text:'Mic error: '+e.error,err:true});render()}};
  try{rec.start();recOn=true;$('mic').classList.add('rec')}catch(e){}
};

/* ---------- voice out ---------- */
function paintSpeak(){$('speakBtn').classList.toggle('on',speak)} paintSpeak();
$('speakBtn').onclick=()=>{speak=!speak;S.set('ai_speak',speak);paintSpeak();if(!speak){try{speechSynthesis.cancel()}catch(e){}}};
function say(t){
  if(!speak||!t) return;
  const clean=t.replace(/[*_#`>]/g,'').replace(/₹/g,'rupees ');
  if(window.LeeApp&&LeeApp.speak){LeeApp.speak(clean,lang);return}
  try{const u=new SpeechSynthesisUtterance(clean);u.lang=/[ऀ-ॿ]/.test(t)?'hi-IN':lang;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}
}

/* ---------- demo ---------- */
function demo(t){return new Promise(r=>setTimeout(()=>{
  const s=t.toLowerCase(); const amt=(t.match(/(?:₹|rs\.?\s*)?(\d[\d,]*)/i)||[])[1];
  if(/message|sandesh/.test(s)) r({ok:true,reply:'1 new message from Demo Client on "Residence G+1, Ganga": "Can we make the kitchen window larger?" — shall I reply?',actions:[{tool:'client_messages',ok:true}]});
  else if(/spend|spent|kharch|total/.test(s)) r({ok:true,reply:'This month: ₹10,420 total — M/s Lee Enterprise ₹8,380, T.N Consultant ₹2,040. ₹3,530 is waiting for your approval.',actions:[{tool:'expense_summary',ok:true}]});
  else if(/update|progress/.test(s)) r({ok:true,reply:'Posted on "Multi-Purpose Sports Complex": "Layout approved by client", progress 30%. The client can see it in their portal.',actions:[{tool:'add_project_update',ok:true}]});
  else if(/create|new project/.test(s)) r({ok:true,reply:'Created "Boundary survey, Doimukh" for Mr. Tage and put it on the website. Client code: K7M2QX — share it with him to track progress.',actions:[{tool:'create_project',ok:true}]});
  else if(/approve/.test(s)) r({ok:true,reply:'Approved 2 pending expenses: ₹1,880 diesel (Tana) and ₹1,200 taxi (Rinku).',actions:[{tool:'pending_expenses',ok:true},{tool:'set_expense_status',ok:true},{tool:'set_expense_status',ok:true}]});
  else if(amt) r({ok:true,reply:`Saved: ₹${amt} — ${t.replace(/.*?\d[\d,]*\s*/,'').slice(0,60)||'expense'} under M/s Lee Enterprise, today. Anything else?`,actions:[{tool:'add_expense',ok:true}]});
  else r({ok:true,reply:'(Demo) I can record expenses, create projects, post updates, put projects on the website and reply to clients. Try one of the examples.',actions:[]});
},900))}
</script>
</body>
</html>
